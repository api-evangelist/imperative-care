aid: imperative-care
name: Imperative Care
description: >-
  Imperative Care is a U.S. medical technology company founded in 2015 by Fred
  Khosravi, neurosurgeon L. Nelson Hopkins, M.D., and Amar Sawhney, Ph.D., that
  develops connected interventional devices to elevate care for people affected
  by devastating vascular diseases such as ischemic stroke, venous
  thromboembolism, and acute limb ischemia. Its portfolio spans the Zoom Stroke
  System (including Zoom intracranial access and aspiration catheters and
  Continuous Dual Aspiration / CDAT technology) for fast, effective clot removal,
  the Symphony Thrombectomy System for venous thromboembolism, and the Prodigy
  Thrombectomy System for acute limb ischemia, with the Telos robotic-assisted
  platform in development in partnership with Proximie. The company was surfaced
  as a portfolio company of D1 Capital and added to the API Evangelist network.
  Imperative Care publishes no public developer API, SDK, or technical developer
  portal; this profile captures its public web, security, and corporate surface.
